# config/database.yml
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

development:
  # 開発は全部同じローカルDBを使う（必要なら分けてもOK）
  primary: &dev_primary
    <<: *default
    database: myapp_development
    host: <%= ENV["PGHOST"] || "localhost" %>
    username: <%= ENV["PGUSER"] || "postgres" %>
    password: <%= ENV["PGPASSWORD"] || "" %>
  cable:
    <<: *dev_primary
  queue:
    <<: *dev_primary

test:
  # テストも同じDB設定を流用
  primary: &test_primary
    <<: *default
    database: myapp_test
    host: <%= ENV["PGHOST"] || "localhost" %>
    username: <%= ENV["PGUSER"] || "postgres" %>
    password: <%= ENV["PGPASSWORD"] || "" %>
  cable:
    <<: *test_primary
  queue:
    <<: *test_primary

production:
  # 本番は Heroku の DATABASE_URL を3つとも参照
  primary: &prod_primary
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
  cable:
    <<: *prod_primary
  queue:
    <<: *prod_primary
