default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

development:
  <<: *default
  database: myapp_development
  username: <%= ENV["PGUSER"] || "postgres" %>
  password: <%= ENV["PGPASSWORD"] || "" %>
  host: <%= ENV["PGHOST"] || "localhost" %>

test:
  <<: *default
  database: myapp_test
  username: <%= ENV["PGUSER"] || "postgres" %>
  password: <%= ENV["PGPASSWORD"] || "" %>
  host: <%= ENV["PGHOST"] || "localhost" %>

production:
  url: <%= ENV["DATABASE_URL"] %>

  # ActionCable (solid_cable用)
  cable:
    url: <%= ENV["DATABASE_URL"] %>
