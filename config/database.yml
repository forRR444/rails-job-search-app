# config/database.yml
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

development:
  primary:
    <<: *default
    database: myapp_development
    host: <%= ENV.fetch("PGHOST", "localhost") %>
    username: <%= ENV.fetch("PGUSER", "postgres") %>
    password: <%= ENV.fetch("PGPASSWORD", "") %>
  cable:
    <<: *default
    database: myapp_development_cable
    host: <%= ENV.fetch("PGHOST", "localhost") %>
    username: <%= ENV.fetch("PGUSER", "postgres") %>
    password: <%= ENV.fetch("PGPASSWORD", "") %>

test:
  primary:
    <<: *default
    database: myapp_test
    host: <%= ENV.fetch("PGHOST", "localhost") %>
    username: <%= ENV.fetch("PGUSER", "postgres") %>
    password: <%= ENV.fetch("PGPASSWORD", "") %>
  cable:
    <<: *default
    database: myapp_test_cable
    host: <%= ENV.fetch("PGHOST", "localhost") %>
    username: <%= ENV.fetch("PGUSER", "postgres") %>
    password: <%= ENV.fetch("PGPASSWORD", "") %>

production:
  # 本番は Heroku の DATABASE_URL を使う（Primary も Cable も同じアドオンを利用）
  primary:
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
  cable:
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
