# config/database.yml

default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  username: <%= ENV.fetch("PGUSER", "postgres") %>
  password: <%= ENV.fetch("PGPASSWORD", "") %>
  host: <%= ENV.fetch("PGHOST", "localhost") %>
  port: <%= ENV.fetch("PGPORT", 5432) %>

development:
  <<: *default
  database: job_search_app_development

test:
  <<: *default
  database: job_search_app_test

# --- 本番(Heroku) ---
production:
  default: &prod_default
    url: <%= ENV["DATABASE_URL"] %>
    pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

  primary:
    <<: *prod_default
  cache:
    <<: *prod_default
    database_tasks: false
  queue:
    <<: *prod_default
    database_tasks: false
  cable:
    <<: *prod_default
    database_tasks: false
